function getR(){return cS==='A'?DATA.rA:DATA.rB;}

function setR(a){if(cS==='A')DATA.rA=a;else DATA.rB=a;persist();}
function setT(a){if(cS==='A')DATA.tA=a;else DATA.tB=a;persist();}
function mDu(r){return(parseInt(r.bk)||0)*30+(parseInt(r.esc)||0)*30+(parseInt(r.ass)||0)*30;}
function mPa(r){return(r.pays||[]).reduce(function(s,p){return s+(parseFloat(p.mt)||0);},0);}
function nR(r){return(parseInt(r.bk)||0)+(parseInt(r.esc)||0)+(parseInt(r.ass)||0);}
function nP(r){return(parseInt(r.adults)||0)+(parseInt(r.accomp)||0);}
function stat(r){var du=mDu(r),pa=mPa(r);if(du===0)return'pending';if(pa>=du)return'paid';if(pa>0)return'partial';return'pending';}
function f2(n){return Math.round(n*100)/100;}
function xe(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function getChairs(tblId,rs){
  var c=[];
  var rl=rs.filter(function(r){return String(r.table)===String(tblId);});
  for(var i=0;i<rl.length;i++){
    var r=rl[i];
    for(var j=0;j<(parseInt(r.bk)||0);j++)c.push({t:'baeckeoffe',n:r.nom});
    for(var j=0;j<(parseInt(r.esc)||0);j++)c.push({t:'escalope',n:r.nom});
    for(var j=0;j<(parseInt(r.ass)||0);j++)c.push({t:'assiette',n:r.nom});
    for(var j=0;j<(parseInt(r.accomp)||0);j++)c.push({t:'accompagnant',n:r.nom});
  }
  return c;
}

function drawTable(pt,chairs,capacity,isSel,isOver){
  var r=R_CHAIR,tw=TBL_W;
  var perSide=Math.ceil(capacity/2);
  var th=perSide*(r*2);
  var ang=(pt.angle||0)*Math.PI/180;
  var cos=Math.cos(ang),sin=Math.sin(ang);
  function rot(lx,ly){return {x:pt.cx+lx*cos-ly*sin,y:pt.cy+lx*sin+ly*cos};}

  var svg='<g onclick="planClick('+pt.id+')" style="cursor:'+(selR?'pointer':'default')+'">';
  // Table rectangle
  var corners=[[-tw/2,-th/2],[tw/2,-th/2],[tw/2,th/2],[-tw/2,th/2]];
  var pts=corners.map(function(c){var p=rot(c[0],c[1]);return p.x.toFixed(1)+','+p.y.toFixed(1);}).join(' ');
  var fill=isSel?'#BFDBFE':isOver?'#FECACA':'#e2e8f0';
  var stroke=isSel?'#185FA5':isOver?'#E24B4A':'#94a3b8';
  var sw=isSel||isOver?2:1;
  svg+='<polygon points="'+pts+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'"/>';

  // Label above
  var lp=rot(0,-th/2-7);
  svg+='<text x="'+lp.x.toFixed(1)+'" y="'+lp.y.toFixed(1)+'" text-anchor="middle" dominant-baseline="middle" font-size="8" font-weight="bold" fill="#333" transform="rotate('+(pt.angle||0)+','+lp.x.toFixed(1)+','+lp.y.toFixed(1)+')">'+xe(pt.name)+'</text>';

  // Chairs: left side = even indices, right side = odd indices
  var lx=-tw/2-r-2, rx=tw/2+r+2;
  var filled=chairs.length;
  for(var i=0;i<perSide;i++){
    var ly=-th/2+r+i*(r*2);
    // Left (even)
    var ci=i*2;
    var ch=ci<filled?chairs[ci]:null;
    var cf=ch?CCOL[ch.t]:'#fff', cs=ch?CSTROKE[ch.t]:'rgba(0,0,0,.2)';
    var lp2=rot(lx,ly);
    svg+='<circle cx="'+lp2.x.toFixed(1)+'" cy="'+lp2.y.toFixed(1)+'" r="'+r+'" fill="'+cf+'" stroke="'+cs+'" stroke-width="1"><title>'+(ch?xe(ch.n+' ('+ch.t+')'):'Libre')+'</title></circle>';
    // Right (odd)
    var ci2=i*2+1;
    if(ci2<capacity){
      var ch2=ci2<filled?chairs[ci2]:null;
      var cf2=ch2?CCOL[ch2.t]:'#fff', cs2=ch2?CSTROKE[ch2.t]:'rgba(0,0,0,.2)';
      var rp2=rot(rx,ly);
      svg+='<circle cx="'+rp2.x.toFixed(1)+'" cy="'+rp2.y.toFixed(1)+'" r="'+r+'" fill="'+cf2+'" stroke="'+cs2+'" stroke-width="1"><title>'+(ch2?xe(ch2.n+' ('+ch2.t+')'):'Libre')+'</title></circle>';
    }
  }

  // Count label below
  var occ=chairs.length;
  var op=rot(0,th/2+8);
  svg+='<text x="'+op.x.toFixed(1)+'" y="'+op.y.toFixed(1)+'" text-anchor="middle" dominant-baseline="middle" font-size="7" fill="'+(isOver?'#E24B4A':'#666')+'" transform="rotate('+(pt.angle||0)+','+op.x.toFixed(1)+','+op.y.toFixed(1)+')">'+occ+'/'+capacity+'</text>';
  svg+='</g>';
  return svg;
}

  var h='<div class="card">';

  for(var i=0;i<plan.tables.length;i++){

function tblOcc(tid,rs){return rs.reduce(function(s,r){if(String(r.table)!==String(tid))return s;if(r.id==selR)return s;return s+(parseInt(r.bk)||0)+(parseInt(r.esc)||0)+(parseInt(r.ass)||0)+(parseInt(r.accomp)||0);},0);}
function planClick(tid){

  var doPlace=function(){setR(getR().map(function(x){return x.id==selR?Object.assign({},x,{table:tid}):x;}));flash(xe(r.nom)+' place — '+xe(tblObj.name));selR=null;};

}

  h+='</div>';return h;
}

function bAssoc(){
  var all=DATA.rA.concat(DATA.rB),map={};
  for(var i=0;i<all.length;i++){var r=all[i];if(!r.assoc)continue;if(!map[r.assoc])map[r.assoc]={a:r.assoc,nb:0,bk:0,es:0,as:0,du:0,rist:0};map[r.assoc].nb+=(parseInt(r.adults)||0)+(parseInt(r.accomp)||0);map[r.assoc].bk+=parseInt(r.bk)||0;map[r.assoc].es+=parseInt(r.esc)||0;map[r.assoc].as+=parseInt(r.ass)||0;map[r.assoc].du+=mDu(r);map[r.assoc].rist+=nR(r)*RIST;}
  var rows=Object.values(map).sort(function(a,b){return b.nb-a.nb;});
  var tnb=rows.reduce(function(s,r){return s+r.nb;},0),tdu=rows.reduce(function(s,r){return s+r.du;},0),tri=rows.reduce(function(s,r){return s+r.rist;},0);

    h+='<div style="overflow-x:auto"><table class="atbl"><thead><tr><th>Association</th><th>Pers.</th><th>Bk</th><th>Esc</th><th>Ass</th><th>Montant</th><th>Ristourne</th></tr></thead><tbody>';
    for(var i=0;i<rows.length;i++){var r=rows[i];h+='<tr><td><span class="abadge">'+xe(r.a)+'</span></td><td style="text-align:center;font-weight:700">'+r.nb+'</td><td style="text-align:center;color:'+(r.bk>0?'#0F6E56':'#bbb')+'">'+r.bk+'</td><td style="text-align:center;color:'+(r.es>0?'#185FA5':'#bbb')+'">'+r.es+'</td><td style="text-align:center;color:'+(r.as>0?'#1a1a1a':'#bbb')+'">'+r.as+'</td><td style="text-align:right">'+(r.du>0?r.du+' €':'—')+'</td><td style="text-align:right;font-weight:700;color:#0F6E56">'+(r.rist>0?f2(r.rist)+' €':'—')+'</td></tr>';}
    h+='<tr class="tot"><td>TOTAL</td><td style="text-align:center">'+tnb+'</td><td colspan="3"></td><td style="text-align:right">'+tdu+' €</td><td style="text-align:right;color:#0F6E56">'+f2(tri)+' €</td></tr></tbody></table></div>';
  }else{h+='<div style="color:#888;font-size:13px;margin-bottom:12px">Aucune reservation avec association.</div>';}
  h+='<div class="st" style="margin-top:14px">Gerer les associations</div>';

  h+='<div style="display:flex;flex-wrap:wrap;gap:4px;padding:10px;background:#f5f5f0;border-radius:7px">';
  var sorted=ASSOC.slice().sort();

  h+='</div></div>';return h;
}

function swS(s){cS=s;showF=false;editR=null;selR=null;fSrc='';fSt='';fAs='';R();}

function doDel(){DATA.rA=DATA.rA.filter(function(r){return r.id!==delC;});DATA.rB=DATA.rB.filter(function(r){return r.id!==delC;});persist();delC=null;flash('Reservation supprimee');}

function saveF(){
  if(!F.nom.trim()){fErr='Le nom est obligatoire';R();return;}
  var adults=parseInt(F.adults)||0,tot=(parseInt(F.bk)||0)+(parseInt(F.esc)||0)+(parseInt(F.ass)||0);

function autoAss(){
  var rs=getR(),t=getT();
  var nonA=rs.filter(function(r){return !r.table;}).sort(function(a,b){var o={orchestre:0,milieu:1,fond:2};return(o[a.pref]||1)-(o[b.pref]||1);});
  var occ={};rs.forEach(function(r){if(r.table){var n=(parseInt(r.bk)||0)+(parseInt(r.esc)||0)+(parseInt(r.ass)||0)+(parseInt(r.accomp)||0);occ[r.table]=(occ[r.table]||0)+n;}});
  var asgn={},placed=0;
  for(var i=0;i<nonA.length;i++){
    var r=nonA[i],nb=(parseInt(r.bk)||0)+(parseInt(r.esc)||0)+(parseInt(r.ass)||0)+(parseInt(r.accomp)||0);if(!nb)continue;
    var ordre=r.pref==='orchestre'?['orchestre','milieu','fond']:r.pref==='fond'?['fond','milieu','orchestre']:['milieu','fond','orchestre'];
    var done=false;
    for(var z=0;z<ordre.length&&!done;z++){var zt=t.filter(function(x){return x.zone===ordre[z];});for(var j=0;j<zt.length&&!done;j++){var cur=(occ[zt[j].id]||0)+(asgn[zt[j].id]||0);if(cur+nb<=zt[j].capacity){asgn[zt[j].id]=(asgn[zt[j].id]||0)+nb;asgn['r'+r.id]=zt[j].id;done=true;placed++;}}}
  }
  setR(rs.map(function(r){return asgn['r'+r.id]?Object.assign({},r,{table:asgn['r'+r.id]}):r;}));
  flash(placed+' reservation(s) placee(s)');
}

function expCSV(){var rs=getR(),t=getT();var hdr=['N','Nom','Adresse','Commune','Association','Adultes','Accompagnants','Baeckeoffe','Escalope','Assiette','Montant du','Montant paye','Reste','Paiements','Statut','Table','Zone','Preference','Notes'];var rows=rs.map(function(r){var tbl=t.find(function(x){return String(x.id)===String(r.table);});var du=mDu(r),pa=f2(mPa(r));return[r.id,r.nom||'',r.adr||'',r.commune||'',r.assoc||'',parseInt(r.adults)||0,parseInt(r.accomp)||0,parseInt(r.bk)||0,parseInt(r.esc)||0,parseInt(r.ass)||0,du,pa,f2(du-pa),(r.pays||[]).filter(function(p){return parseFloat(p.mt)>0;}).map(function(p){var extra=p.type==='cheque'?[p.emetteur,p.banque,p.ref].filter(Boolean).join('/'):p.ref||'';return p.type+' '+p.mt+'e'+(extra?' ('+extra+')':'');}).join(' | '),stat(r)==='paid'?'Paye':stat(r)==='partial'?'Partiel':'Attente',tbl?tbl.name:'',tbl?tbl.zone:'',r.pref||'',r.notes||''];});var csv=hdr.join(';')+'\n'+rows.map(function(r){return r.map(function(v){return'"'+String(v).replace(/"/g,'""')+'"';}).join(';');}).join('\n');var blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='Baeckeoffe2025_Salle'+cS+'.csv';a.click();URL.revokeObjectURL(url);flash('Export CSV telecharge');}

(function(){var k=localStorage.getItem('bk_key');if(k){if(k!=='LOCAL'){AKEY=k;doLoad(function(d){if(d&&(d.rA||d.rB)){DATA=d;saveLocal(DATA);}R();});}else R();}else{R();document.getElementById('sovl').style.display='flex';}})();
