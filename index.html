function optTerrines(n){
  if(n<=0)return[];
  for(var t=n;t<=n+3;t++){
    var dp=new Array(t+1).fill(null);dp[0]=[];
    for(var i=1;i<=t;i++){for(var j=0;j<TSIZES.length;j++){var s=TSIZES[j];if(s<=i&&dp[i-s]!==null){var c=dp[i-s].concat([s]);if(dp[i]===null||c.length<dp[i].length)dp[i]=c;}}}
    if(dp[t]!==null)return dp[t].sort(function(a,b){return b-a;});
  }
  var r=[],rem=n;while(rem>0){var s=4;for(var j=0;j<TSIZES.length;j++){if(TSIZES[j]<=rem)s=TSIZES[j];}r.push(s);rem-=s;}return r;
}

}

var F={salle:'A',nom:'',adr:'',commune:'',assoc:'',adults:'',accomp:'',bk:'',esc:'',ass:'',pref:'',notes:'',table:'',pays:[{type:'especes',mt:'',ref:''}]};

function resetF(r){
  if(r){F={salle:r.salle||cS,nom:r.nom||'',adr:r.adr||'',commune:r.commune||'',assoc:r.assoc||'',adults:r.adults||'',accomp:r.accomp||'',bk:r.bk||'',esc:r.esc||'',ass:r.ass||'',pref:r.pref||'',notes:r.notes||'',table:r.table||'',pays:r.pays&&r.pays.length?r.pays.map(function(p){return{type:p.type,mt:p.mt,ref:p.ref};}): [{type:'especes',mt:'',ref:''}]};}
  else{F={salle:cS,nom:'',adr:'',commune:'',assoc:'',adults:'',accomp:'',bk:'',esc:'',ass:'',pref:'',notes:'',table:'',pays:[{type:'especes',mt:'',ref:''}]};}
  fErr='';
}

function flash(m,d){flashM=m;if(flashTm)clearTimeout(flashTm);flashTm=setTimeout(function(){flashM='';R();},d||2500);R();}

function R(){
  var el=document.getElementById('app');
  if(el)el.innerHTML=buildApp();
  renderSync();
}

function buildApp(){
  var h='<div class="topbar"><h1>Baeckeoffe 2025</h1><div id="sdot" class="sync-dot"></div>';
  h+='<div class="tabs">';
  h+=tb('res','Réservations')+tb('plan','Plan')+tb('ter','Terrines')+tb('tbls','Tables')+tb('assoc','Associations');
  h+='</div></div>';
  h+='<div class="content">';
  if(flashM)h+='<div class="al ok">'+esc(flashM)+'</div>';
  if(cTab!=='assoc')h+=buildSR();
  if(cTab==='res')h+=showF?buildForm():buildList();
  if(cTab==='plan')h+=buildPlan();
  if(cTab==='ter')h+=buildTer();
  if(cTab==='tbls')h+=buildTbls();
  if(cTab==='assoc')h+=buildAssoc();
  if(delC)h+=buildDelModal();
  h+='</div>';
  return h;
}
function tb(id,lbl){return '<button class="tab'+(cTab===id?' active':'')+'" onclick="cTab=\''+id+'\';selR=null;R()">'+lbl+'</button>';}

function buildSR(){
  var btns='';
  if(cTab==='res'&&!showF)btns='<button class="btn primary" onclick="openF()">+ Nouvelle réservation</button>';
  if(cTab==='plan')btns='<button class="btn ok" onclick="autoAss()">Placement auto</button> <button class="btn" onclick="expCSV()">Export CSV</button> <button class="btn" onclick="window.print()">Imprimer</button>';
  if(showF)btns='<button class="btn" onclick="closeF()">← Liste</button>';
  return '<div class="row"><div class="salle-tabs"><button class="stab a'+(cS==='A'?' on':'')+'" onclick="swS(\'A\')">Salle A ('+DATA.rA.length+')</button><button class="stab b'+(cS==='B'?' on':'')+'" onclick="swS(\'B\')">Salle B ('+DATA.rB.length+')</button></div><div style="display:flex;gap:6px;flex-wrap:wrap">'+btns+'</div></div>';
}

function buildForm(){
  var adults=parseInt(F.adults)||0;
  var bk=parseInt(F.bk)||0,es=parseInt(F.esc)||0,as=parseInt(F.ass)||0;
  var tot=bk+es+as;
  var du=bk*30+es*30+as*15;
  var pa=f2(F.pays.reduce(function(s,p){return s+(parseFloat(p.mt)||0);},0));
  var reste=f2(du-pa);
  var ftbls=F.salle==='A'?DATA.tA:DATA.tB;
  var h='<div class="card">';
  h+='<div style="font-size:15px;font-weight:700;margin-bottom:12px">'+(editR?'Modifier — '+esc(editR.nom):'Nouvelle réservation')+'</div>';
  if(fErr)h+='<div class="al err">'+esc(fErr)+'</div>';

  h+='<div class="stitle">Salle</div>';
  h+='<div class="ssel"><button class="sbtn a'+(F.salle==='A'?' on':'')+'" onclick="F.salle=\'A\';F.table=\'\';R()">Salle A</button><button class="sbtn b'+(F.salle==='B'?' on':'')+'" onclick="F.salle=\'B\';F.table=\'\';R()">Salle B</button></div>';

  h+='<div class="stitle">Identité</div>';
  h+='<div class="fg"><label>Nom *</label><input id="f-nom" value="'+esc(F.nom)+'" onchange="F.nom=this.value" placeholder="Nom de la réservation"/></div>';
  h+='<div class="gr2"><div class="fg"><label>Adresse</label><input id="f-adr" value="'+esc(F.adr)+'" onchange="F.adr=this.value" placeholder="Numéro et rue"/></div><div class="fg"><label>Commune</label><input id="f-com" value="'+esc(F.commune)+'" onchange="F.commune=this.value" placeholder="Ville"/></div></div>';
  h+='<div class="fg"><label>Association</label><select onchange="F.assoc=this.value"><option value="">— aucune —</option>';
  for(var i=0;i<ASSOC.length;i++)h+='<option value="'+esc(ASSOC[i])+'"'+(F.assoc===ASSOC[i]?' selected':'')+'>'+esc(ASSOC[i])+'</option>';
  h+='</select></div>';

  h+='<div class="stitle">Personnes &amp; Repas</div>';
  if(adults>0)h+='<div class="al warn" style="font-size:12px;margin-bottom:7px">'+adults+' adulte(s) → saisir exactement <strong>'+adults+'</strong> repas au total</div>';
  h+='<div class="gr2"><div class="fg"><label>Adultes payants</label><input type="number" min="0" id="f-adu" value="'+esc(F.adults)+'" onchange="F.adults=this.value;R()" placeholder="0"/></div>';
  h+='<div class="fg"><label>Accompagnants (chaise)</label><input type="number" min="0" id="f-acc" value="'+esc(F.accomp)+'" onchange="F.accomp=this.value" placeholder="0"/></div></div>';

  h+='<div class="repas3">';
  h+='<div class="rcard'+(bk>0?' on':'')+'"><label>Baeckeoffe</label><input type="number" min="0" id="f-bk" value="'+esc(F.bk)+'" onchange="F.bk=this.value;R()" placeholder="0"/><div class="sub">30 €</div></div>';
  h+='<div class="rcard'+(es>0?' on':'')+'"><label>Escalope</label><input type="number" min="0" id="f-esc" value="'+esc(F.esc)+'" onchange="F.esc=this.value;R()" placeholder="0"/><div class="sub">30 €</div></div>';
  h+='<div class="rcard'+(as>0?' on':'')+'"><label>Assiette</label><input type="number" min="0" id="f-ass" value="'+esc(F.ass)+'" onchange="F.ass=this.value;R()" placeholder="0"/><div class="sub">15 €</div></div>';
  h+='</div>';

  if(adults>0){var ok=tot===adults;h+='<div class="chk '+(ok?'ok':'err')+'">'+(ok?'✓ '+tot+' repas = '+adults+' adulte(s) OK':'⚠ '+tot+' repas pour '+adults+' adulte(s) — '+(adults>tot?'manque '+(adults-tot):(tot-adults)+' en trop'))+'</div>';}

  if(du>0){
    h+='<div class="tbox"><div><div class="lbl">Total à payer</div><div class="det">'+bk+' × Bk 30€ + '+es+' × Esc 30€ + '+as+' × Ass 15€</div></div><div class="amt">'+du+' €</div></div>';
  }

  h+='<div class="stitle">Paiements</div>';
  for(var i=0;i<F.pays.length;i++){
    var p=F.pays[i];
    h+='<div class="prow"><select onchange="F.pays['+i+'].type=this.value">';
    for(var j=0;j<PTYPES.length;j++)h+='<option value="'+PTYPES[j].v+'"'+(p.type===PTYPES[j].v?' selected':'')+'>'+PTYPES[j].l+'</option>';
    h+='</select><input type="number" min="0" step="0.5" value="'+esc(p.mt)+'" onchange="F.pays['+i+'].mt=this.value;R()" placeholder="0 €"/>';

    else pst='<span style="color:#A32D2D;font-weight:700">Trop-perçu : '+Math.abs(reste)+' €</span>';
  }
  h+='<div class="psum"><button class="btn sm" onclick="addPay()">+ Paiement</button><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span>Encaissé : <strong>'+pa+' €</strong>'+(du>0?' / '+du+' €':'')+' </span>'+pst+'</div></div>';

  h+='<div class="stitle">Placement</div>';
  h+='<div class="gr2"><div class="fg"><label>Préférence</label><select onchange="F.pref=this.value"><option value="">Indifférent</option><option value="orchestre"'+(F.pref==='orchestre'?' selected':'')+'>Proche orchestre</option><option value="milieu"'+(F.pref==='milieu'?' selected':'')+'>Milieu</option><option value="fond"'+(F.pref==='fond'?' selected':'')+'>Fond</option></select></div>';
  h+='<div class="fg"><label>Table (Salle '+F.salle+')</label><select onchange="F.table=this.value"><option value="">Non assigné</option>';
  for(var i=0;i<ftbls.length;i++)h+='<option value="'+ftbls[i].id+'"'+(String(F.table)===String(ftbls[i].id)?' selected':'')+'>'+esc(ftbls[i].name)+' — '+ftbls[i].zone+' ('+ftbls[i].capacity+' pl.)</option>';
  h+='</select></div></div>';
  h+='<div class="fg"><label>Notes</label><input value="'+esc(F.notes)+'" onchange="F.notes=this.value" placeholder="Remarques..."/></div>';
  h+='<div class="factions"><button class="btn" onclick="closeF()">Annuler</button><button class="btn primary" onclick="saveF()">Enregistrer</button></div>';
  h+='</div>';
  return h;
}

function buildList(){
  var rs=getR();
  var bk=rs.reduce(function(s,r){return s+(parseInt(r.bk)||0);},0);
  var es=rs.reduce(function(s,r){return s+(parseInt(r.esc)||0);},0);
  var as=rs.reduce(function(s,r){return s+(parseInt(r.ass)||0);},0);
  var du=rs.reduce(function(s,r){return s+mDu(r);},0);
  var pa=f2(rs.reduce(function(s,r){return s+mPa(r);},0));
  var pct=du>0?Math.min(100,Math.round(pa/du*100)):0;
  var flt=rs.filter(function(r){
    if(fSrc&&!(r.nom||'').toLowerCase().includes(fSrc.toLowerCase())&&!(r.commune||'').toLowerCase().includes(fSrc.toLowerCase()))return false;
    if(fSt&&stat(r)!==fSt)return false;
    if(fAs&&r.assoc!==fAs)return false;
    return true;
  });
  var h='<div class="card">';
  h+='<div class="stats">';
  h+='<div class="sc"><div class="v">'+rs.length+'</div><div class="l">Réservations</div></div>';
  h+='<div class="sc"><div class="v">'+bk+'</div><div class="l">Baeckeoffe</div></div>';
  h+='<div class="sc"><div class="v">'+es+'</div><div class="l">Escalope</div></div>';
  h+='<div class="sc"><div class="v">'+as+'</div><div class="l">Assiette</div></div>';
  h+='<div class="sc"><div class="v" style="color:'+(pa>=du&&du>0?'#3B6D11':'#854F0B')+'">'+pa+'€</div><div class="l">/ '+du+'€</div><div class="pb"><div class="pbf" style="width:'+pct+'%;background:'+(pa>=du?'#3B6D11':'#854F0B')+'"></div></div></div>';
  h+='</div>';
  h+='<div class="fbar"><input placeholder="Rechercher..." onchange="fSrc=this.value;R()" value="'+esc(fSrc)+'" style="width:150px"/>';
  h+='<select onchange="fSt=this.value;R()"><option value="">Tous statuts</option><option value="paid"'+(fSt==='paid'?' selected':'')+'>Payé</option><option value="partial"'+(fSt==='partial'?' selected':'')+'>Partiel</option><option value="pending"'+(fSt==='pending'?' selected':'')+'>Attente</option></select>';
  var assocs=[...new Set(rs.map(function(r){return r.assoc;}).filter(Boolean))].sort();
  h+='<select onchange="fAs=this.value;R()" style="max-width:160px"><option value="">Toutes assoc.</option>';
  for(var i=0;i<assocs.length;i++)h+='<option value="'+esc(assocs[i])+'"'+(fAs===assocs[i]?' selected':'')+'>'+esc(assocs[i])+'</option>';
  h+='</select></div>';
  if(flt.length===0){h+='<div class="empty">Aucune réservation. Cliquez sur "+ Nouvelle réservation".</div>';}
  else{
    var t=getT();
    h+='<div style="overflow-x:auto"><table class="tbl"><thead><tr><th>#</th><th>Nom / Commune</th><th>Assoc.</th><th style="text-align:center">Bk</th><th style="text-align:center">Esc</th><th style="text-align:center">Ass</th><th style="text-align:center">Acc.</th><th style="text-align:right">Dû</th><th style="text-align:right">Payé</th><th>Paiements</th><th>Statut</th><th>Table</th><th></th></tr></thead><tbody>';
    for(var i=0;i<flt.length;i++){
      var r=flt[i],du2=mDu(r),pa2=f2(mPa(r)),st=stat(r);
      var tbl=null;for(var j=0;j<t.length;j++){if(String(t[j].id)===String(r.table)){tbl=t[j];break;}}
      var pays='';
      if(r.pays)for(var j=0;j<r.pays.length;j++){var p=r.pays[j];if(parseFloat(p.mt)>0){var tp=PTYPES[0];for(var k=0;k<PTYPES.length;k++){if(PTYPES[k].v===p.type){tp=PTYPES[k];break;}}pays+='<span style="padding:1px 4px;border-radius:3px;font-size:10px;font-weight:700;background:'+(p.type==='especes'?'#EAF3DE':p.type==='cheque'?'#E6F1FB':p.type==='virement'?'#EEEDFE':'#f0f0ea')+';color:'+(p.type==='especes'?'#3B6D11':p.type==='cheque'?'#0C447C':p.type==='virement'?'#3C3489':'#666')+'" title="'+esc(p.ref||'')+'">'+tp.l.slice(0,3)+' '+parseFloat(p.mt).toFixed(0)+'€</span> ';}}
      h+='<tr><td style="color:#888;font-size:10px">'+r.id+'</td>';
      h+='<td><div style="font-weight:700;font-size:12px">'+esc(r.nom)+'</div>'+(r.commune?'<div style="font-size:10px;color:#888">'+esc(r.commune)+'</div>':r.adr?'<div style="font-size:10px;color:#888">'+esc(r.adr)+'</div>':'')+'</td>';
      h+='<td>'+(r.assoc?'<span class="abadge">'+esc(r.assoc)+'</span>':'')+'</td>';
      h+='<td style="text-align:center;font-weight:'+(( parseInt(r.bk)||0)>0?700:400)+';color:'+((parseInt(r.bk)||0)>0?'#0F6E56':'#bbb')+'">'+(parseInt(r.bk)||0)+'</td>';
      h+='<td style="text-align:center;font-weight:'+((parseInt(r.esc)||0)>0?700:400)+';color:'+((parseInt(r.esc)||0)>0?'#185FA5':'#bbb')+'">'+(parseInt(r.esc)||0)+'</td>';
      h+='<td style="text-align:center;font-weight:'+((parseInt(r.ass)||0)>0?700:400)+';color:'+((parseInt(r.ass)||0)>0?'#1a1a1a':'#bbb')+'">'+(parseInt(r.ass)||0)+'</td>';
      h+='<td style="text-align:center;color:#888">'+(parseInt(r.accomp)||0)+'</td>';
      h+='<td style="text-align:right">'+(du2>0?du2+' €':'—')+'</td>';
      h+='<td style="text-align:right;color:'+(pa2>=du2&&du2>0?'#3B6D11':pa2>0?'#854F0B':'#888')+'">'+(pa2>0?pa2+' €':'—')+'</td>';
      h+='<td><div style="display:flex;gap:2px;flex-wrap:wrap">'+pays+'</div></td>';
      h+='<td><span class="bdg bdg-'+st+'">'+(st==='paid'?'Payé':st==='partial'?'Part.':'Att.')+'</span></td>';
      h+='<td>'+(tbl?'<span style="font-size:10px;padding:1px 5px;border-radius:4px;font-weight:700;background:'+(tbl.zone==='orchestre'?'#EFF6FF':tbl.zone==='milieu'?'#F5F3FF':'#F0FDF4')+';color:'+(tbl.zone==='orchestre'?'#1E40AF':tbl.zone==='milieu'?'#5B21B6':'#166534')+'">'+esc(tbl.name)+'</span>':'<span style="color:#bbb;font-size:10px">—</span>')+'</td>';
      h+='<td><div style="display:flex;gap:2px"><button class="btn sm" onclick="editRes('+r.id+')">✎</button><button class="btn sm danger" onclick="delC='+r.id+';R()">✕</button></div></td></tr>';
    }
    h+='</tbody></table></div>';
  }
  h+='</div>';return h;
}

function buildPlan(){
  var rs=getR(),t=getT();
  var unass=rs.filter(function(r){return !r.table&&(nR(r)>0||nP(r)>0);});
  var h='<div class="card">';
  h+='<div class="lgd">';
  var lkeys=[['empty','Libre'],['baeckeoffe','Baeckeoffe'],['escalope','Escalope'],['assiette','Assiette'],['accompagnant','Accompagnant']];
  for(var i=0;i<lkeys.length;i++)h+='<div style="display:flex;align-items:center;gap:4px"><div class="ldot" style="background:'+CCOL[lkeys[i][0]]+'"></div><span style="color:#666">'+lkeys[i][1]+'</span></div>';
  h+='</div>';
  if(unass.length>0){
    h+='<div class="ubar"><strong>'+unass.length+'</strong> non placée(s) — sélectionnez puis cliquez une table :<div style="margin-top:5px">';
    for(var i=0;i<unass.length;i++)h+='<span class="rpill'+(selR===unass[i].id?' on':'')+'" onclick="selR='+(selR===unass[i].id?'null':unass[i].id)+';R()">'+esc(unass[i].nom)+' ('+(nR(unass[i])||nP(unass[i]))+')</span>';
    h+='</div>';
    if(selR){var sr=rs.find(function(r){return r.id===selR;});h+='<div style="margin-top:4px;font-size:11px;font-style:italic">✓ Sélectionné : <strong>'+(sr?esc(sr.nom):'')+'</strong></div>';}
    h+='</div>';
  }
  var zones=['orchestre','milieu','fond'],zl={orchestre:'Proche orchestre',milieu:'Centre',fond:'Fond'};
  for(var z=0;z<zones.length;z++){
    var zt=t.filter(function(x){return x.zone===zones[z];});if(!zt.length)continue;
    h+='<div class="pzone"><div class="ztitle '+zones[z]+'">'+zl[zones[z]]+'</div><div class="twrap">';
    for(var i=0;i<zt.length;i++){
      var tbl=zt[i];
      var chairs=buildChairs(tbl,rs);
      var occ=chairs.filter(function(c){return c.type!=='empty';}).length;
      var over=occ>tbl.capacity;
      h+='<div class="tblk '+tbl.zone+(dragOT===tbl.id?' tgt':'')+(selR?' selectable':'')+'" style="'+(over?'border-color:#E24B4A!important':'')+'" onclick="tblClick('+tbl.id+')" ondragover="event.preventDefault();dragOT='+tbl.id+';R()" ondragleave="dragOT=null;R()" ondrop="dropT(event,'+tbl.id+')">';
      h+='<div class="tn">'+esc(tbl.name)+'</div><div class="cwrap">';
      for(var j=0;j<chairs.length;j++)h+='<div class="ch" title="'+esc(chairs[j].nom?chairs[j].nom+' ('+chairs[j].type+')':'Libre')+'" style="background:'+(CCOL[chairs[j].type]||'#fff')+'"></div>';
      h+='</div><div class="tocc" style="color:'+(over?'#A32D2D':'#888')+'">'+occ+'/'+tbl.capacity+(over?' ⚠':'')+'</div></div>';
    }
    h+='</div></div>';
  }
  var placed=rs.filter(function(r){return r.table;});
  if(placed.length>0){
    h+='<div style="margin-top:8px"><div class="stitle">Placées — glissez pour déplacer</div><div style="display:flex;gap:4px;flex-wrap:wrap">';
    for(var i=0;i<placed.length;i++){
      var r=placed[i],tbl=null;
      for(var j=0;j<t.length;j++){if(String(t[j].id)===String(r.table)){tbl=t[j];break;}}
      h+='<div class="ppill" draggable="true" ondragstart="event.dataTransfer.setData(\'resId\',\''+r.id+'\')" ondragend="dragOT=null;R()">'+esc(r.nom)+' → '+(tbl?esc(tbl.name):'?')+'</div>';
    }
    h+='</div></div>';
  }
  h+='</div>';return h;
}

function buildChairs(tbl,rs){
  var chairs=[];
  var rl=rs.filter(function(r){return String(r.table)===String(tbl.id);});
  for(var i=0;i<rl.length;i++){
    var r=rl[i];
    for(var j=0;j<(parseInt(r.bk)||0);j++)chairs.push({type:'baeckeoffe',nom:r.nom});
    for(var j=0;j<(parseInt(r.esc)||0);j++)chairs.push({type:'escalope',nom:r.nom});
    for(var j=0;j<(parseInt(r.ass)||0);j++)chairs.push({type:'assiette',nom:r.nom});
    for(var j=0;j<(parseInt(r.accomp)||0);j++)chairs.push({type:'accompagnant',nom:r.nom});
  }
  while(chairs.length<tbl.capacity)chairs.push({type:'empty',nom:''});
  return chairs.slice(0,tbl.capacity);
}

function buildTer(){
  var rs=getR(),t=getT();
  var gbk=rs.reduce(function(s,r){return s+(parseInt(r.bk)||0);},0);
  if(gbk===0)return'<div class="card"><div class="empty">Aucun Baeckeoffe pour la Salle '+cS+'.</div></div>';
  var gt=optTerrines(gbk);
  var h='<div class="card"><div style="font-size:15px;font-weight:700;margin-bottom:4px">Terrines — Salle '+cS+'</div>';
  h+='<div style="font-size:13px;color:#666;margin-bottom:10px">Global : <strong>'+gbk+'</strong> Baeckeoffe → <strong>'+gt.length+'</strong> terrine(s) : ';
  for(var i=0;i<gt.length;i++)h+='<span class="tbdg">'+gt[i]+'</span> ';
  h+='</div>';
  var tbks=t.filter(function(tbl){return rs.some(function(r){return String(r.table)===String(tbl.id)&&(parseInt(r.bk)||0)>0;});});
  if(tbks.length===0)h+='<div class="al warn">Assignez d\'abord les réservations aux tables.</div>';
  for(var i=0;i<tbks.length;i++){
    var tbl=tbks[i];
    var grps=rs.filter(function(r){return String(r.table)===String(tbl.id)&&(parseInt(r.bk)||0)>0;}).map(function(r){return{nom:r.nom,bk:parseInt(r.bk)||0,ter:optTerrines(parseInt(r.bk)||0)};});
    var tbk=grps.reduce(function(s,g){return s+g.bk;},0),nter=grps.reduce(function(s,g){return s+g.ter.length;},0);
    h+='<div class="tsec"><div style="font-weight:700;font-size:13px;margin-bottom:7px">'+esc(tbl.name)+' — '+tbk+' Baeckeoffe → '+nter+' terrine(s)</div>';
    for(var j=0;j<grps.length;j++){
      var g=grps[j];
      h+='<div class="trow"><span style="font-weight:700;min-width:100px">'+esc(g.nom)+'</span><span style="color:#666;font-size:11px">'+g.bk+' pers.</span><div>';
      for(var k=0;k<g.ter.length;k++)h+='<span class="tbdg">'+g.ter[k]+' pers.</span> ';
      h+='</div></div>';
    }
    h+='</div>';
  }
  var sans=rs.filter(function(r){return !r.table&&(parseInt(r.bk)||0)>0;});
  if(sans.length>0){
    h+='<div style="margin-top:12px;padding-top:10px;border-top:1px solid #eee"><div style="font-size:13px;font-weight:700;margin-bottom:7px;color:#854F0B">Baeckeoffe sans table assignée</div>';
    for(var i=0;i<sans.length;i++){var r=sans[i],ter=optTerrines(parseInt(r.bk)||0);h+='<div class="trow"><span style="font-weight:700">'+esc(r.nom)+'</span><span style="color:#854F0B;font-size:11px">'+r.bk+' pers. (non placé)</span><div>';for(var j=0;j<ter.length;j++)h+='<span class="tbdg" style="background:#854F0B">'+ter[j]+' pers.</span> ';h+='</div></div>';}
    h+='</div>';
  }
  h+='</div>';return h;
}

function buildTbls(){
  var t=getT();
  var h='<div class="card"><div style="font-size:15px;font-weight:700;margin-bottom:10px">Tables — Salle '+cS+'</div>';
  for(var i=0;i<t.length;i++){
    var tbl=t[i];
    h+='<div class="tcrow">';
    if(etId===tbl.id&&etD){
      h+='<input value="'+esc(etD.name)+'" onchange="etD.name=this.value" style="width:80px;flex:none"/>';
      h+='<input type="number" min="1" max="200" value="'+etD.capacity+'" onchange="etD.capacity=this.value" style="width:65px"/>';
      h+='<select onchange="etD.zone=this.value"><option value="orchestre"'+(etD.zone==='orchestre'?' selected':'')+'>orchestre</option><option value="milieu"'+(etD.zone==='milieu'?' selected':'')+'>milieu</option><option value="fond"'+(etD.zone==='fond'?' selected':'')+'>fond</option></select>';
      h+='<button class="btn sm primary" onclick="saveTbl('+tbl.id+')">✓</button><button class="btn sm" onclick="etId=null;etD=null;R()">✕</button>';
    } else {
      h+='<span style="flex:1;font-size:13px;font-weight:700">'+esc(tbl.name)+'</span>';
      h+='<span style="font-size:12px;color:#666;width:70px">'+tbl.capacity+' pl.</span>';
      h+='<span><span class="zbdg '+tbl.zone+'">'+tbl.zone+'</span></span>';
      h+='<button class="btn sm" onclick="etId='+tbl.id+';etD=Object.assign({},getT().find(function(x){return x.id==='+tbl.id+';}));R()">✎</button>';
      h+='<button class="btn sm danger" onclick="setT(getT().filter(function(x){return x.id!=='+tbl.id+';}));R()">✕</button>';
    }
    h+='</div>';
  }
  h+='<div class="stitle" style="margin-top:12px">Ajouter une table</div>';
  h+='<div style="display:flex;gap:7px;align-items:flex-end;flex-wrap:wrap">';
  h+='<div class="fg" style="width:100px"><label>Nom</label><input value="'+esc(ntbl.name)+'" onchange="ntbl.name=this.value" placeholder="T22"/></div>';
  h+='<div class="fg" style="width:80px"><label>Places</label><input type="number" min="1" max="200" value="'+ntbl.capacity+'" onchange="ntbl.capacity=this.value"/></div>';
  h+='<div class="fg" style="width:120px"><label>Zone</label><select onchange="ntbl.zone=this.value"><option value="orchestre"'+(ntbl.zone==='orchestre'?' selected':'')+'>orchestre</option><option value="milieu"'+(ntbl.zone==='milieu'?' selected':'')+'>milieu</option><option value="fond"'+(ntbl.zone==='fond'?' selected':'')+'>fond</option></select></div>';
  h+='<button class="btn primary" onclick="addTbl()" style="align-self:flex-end">Ajouter</button></div>';
  h+='</div>';return h;
}

function buildAssoc(){
  var all=DATA.rA.concat(DATA.rB);
  var map={};
  for(var i=0;i<all.length;i++){
    var r=all[i];if(!r.assoc)continue;
    if(!map[r.assoc])map[r.assoc]={a:r.assoc,nb:0,bk:0,es:0,as:0,du:0,rist:0};
    map[r.assoc].nb+=(parseInt(r.adults)||0)+(parseInt(r.accomp)||0);
    map[r.assoc].bk+=parseInt(r.bk)||0;
    map[r.assoc].es+=parseInt(r.esc)||0;
    map[r.assoc].as+=parseInt(r.ass)||0;
    map[r.assoc].du+=mDu(r);
    map[r.assoc].rist+=nR(r)*RIST;
  }
  var rows=Object.values(map).sort(function(a,b){return b.nb-a.nb;});
  if(rows.length===0)return'<div class="card"><div class="empty">Aucune réservation avec association.</div></div>';
  var tnb=rows.reduce(function(s,r){return s+r.nb;},0);
  var tdu=rows.reduce(function(s,r){return s+r.du;},0);
  var tri=rows.reduce(function(s,r){return s+r.rist;},0);
  var h='<div class="card"><div style="font-size:15px;font-weight:700;margin-bottom:4px">Associations — Salle A + B</div>';
  h+='<div style="font-size:12px;color:#666;margin-bottom:10px">Ristourne : '+RIST+' € par repas</div>';
  h+='<div style="overflow-x:auto"><table class="atbl"><thead><tr><th>Association</th><th style="text-align:center">Personnes</th><th style="text-align:center">Bk</th><th style="text-align:center">Esc</th><th style="text-align:center">Ass</th><th style="text-align:right">Montant</th><th style="text-align:right">Ristourne</th></tr></thead><tbody>';
  for(var i=0;i<rows.length;i++){
    var r=rows[i];
    h+='<tr><td><span class="abadge">'+esc(r.a)+'</span></td><td style="text-align:center;font-weight:700">'+r.nb+'</td>';
    h+='<td style="text-align:center;color:'+(r.bk>0?'#0F6E56':'#bbb')+';font-weight:'+(r.bk>0?700:400)+'">'+r.bk+'</td>';
    h+='<td style="text-align:center;color:'+(r.es>0?'#185FA5':'#bbb')+';font-weight:'+(r.es>0?700:400)+'">'+r.es+'</td>';
    h+='<td style="text-align:center;color:'+(r.as>0?'#1a1a1a':'#bbb')+';font-weight:'+(r.as>0?700:400)+'">'+r.as+'</td>';
    h+='<td style="text-align:right">'+(r.du>0?r.du+' €':'—')+'</td>';
    h+='<td style="text-align:right;font-weight:700;color:#0F6E56">'+(r.rist>0?f2(r.rist)+' €':'—')+'</td></tr>';
  }
  h+='<tr class="tot"><td>TOTAL</td><td style="text-align:center">'+tnb+'</td><td colspan="3"></td><td style="text-align:right">'+tdu+' €</td><td style="text-align:right;color:#0F6E56">'+f2(tri)+' €</td></tr>';
  h+='</tbody></table></div></div>';return h;
}

function buildDelModal(){
  return'<div class="mwrap"><div class="modal"><h3 style="font-size:14px;font-weight:700;margin-bottom:8px">Supprimer la réservation ?</h3><p style="font-size:13px;color:#666">Cette action est irréversible.</p><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px"><button class="btn" onclick="delC=null;R()">Annuler</button><button class="btn danger" onclick="doDel()">Supprimer</button></div></div></div>';
}

function swS(s){cS=s;showF=false;editR=null;selR=null;fSrc='';fSt='';fAs='';R();}
function openF(){editR=null;resetF(null);showF=true;R();}
function closeF(){showF=false;editR=null;fErr='';R();}
function editRes(id){
  var r=DATA.rA.concat(DATA.rB).find(function(x){return x.id===id;});
  if(!r)return;
  editR=r;cS=r.salle||cS;resetF(r);showF=true;R();
}
function doDel(){
  DATA.rA=DATA.rA.filter(function(r){return r.id!==delC;});
  DATA.rB=DATA.rB.filter(function(r){return r.id!==delC;});
  persist();delC=null;flash('Réservation supprimée');
}
function addPay(){F.pays.push({type:'especes',mt:'',ref:''});R();}
function rmPay(i){if(F.pays.length>1){F.pays.splice(i,1);R();}}
function saveF(){
  if(!F.nom.trim()){fErr='Le nom est obligatoire';R();return;}
  var adults=parseInt(F.adults)||0,tot=(parseInt(F.bk)||0)+(parseInt(F.esc)||0)+(parseInt(F.ass)||0);
  if(adults>0&&tot!==adults){fErr=adults+' adulte(s) mais '+tot+' repas — il faut exactement '+adults+' repas';R();return;}
  fErr='';
  var r=JSON.parse(JSON.stringify(F));
  r.id=editR?editR.id:DATA.nid;
  var k=F.salle==='A'?'rA':'rB';
  if(!editR){DATA.nid++;DATA[k].push(r);}
  else{DATA.rA=DATA.rA.filter(function(x){return x.id!==r.id;});DATA.rB=DATA.rB.filter(function(x){return x.id!==r.id;});DATA[k].push(r);}
  persist();cS=F.salle;showF=false;editR=null;flash('Réservation enregistrée');
}
function tblClick(tid){if(selR){setR(getR().map(function(r){return r.id===selR?Object.assign({},r,{table:tid}):r;}));flash('Placé !');selR=null;R();}}
function dropT(e,tid){e.preventDefault();var id=parseInt(e.dataTransfer.getData('resId'));if(id){setR(getR().map(function(r){return r.id===id?Object.assign({},r,{table:tid}):r;}));flash('Déplacé !');}dragOT=null;R();}
function autoAss(){
  var rs=getR(),t=getT();
  var nonA=rs.filter(function(r){return !r.table;}).sort(function(a,b){var o={orchestre:0,milieu:1,fond:2};return(o[a.pref]||1)-(o[b.pref]||1);});
  var occ={};rs.forEach(function(r){if(r.table){var n=(parseInt(r.bk)||0)+(parseInt(r.esc)||0)+(parseInt(r.ass)||0)+(parseInt(r.accomp)||0);occ[r.table]=(occ[r.table]||0)+n;}});
  var asgn={};var placed=0;
  for(var i=0;i<nonA.length;i++){
    var r=nonA[i],nb=(parseInt(r.bk)||0)+(parseInt(r.esc)||0)+(parseInt(r.ass)||0)+(parseInt(r.accomp)||0);if(!nb)continue;
    var ordre=r.pref==='orchestre'?['orchestre','milieu','fond']:r.pref==='fond'?['fond','milieu','orchestre']:['milieu','fond','orchestre'];
    var done=false;
    for(var z=0;z<ordre.length&&!done;z++){var zt=t.filter(function(x){return x.zone===ordre[z];});for(var j=0;j<zt.length&&!done;j++){var cur=(occ[zt[j].id]||0)+(asgn[zt[j].id]||0);if(cur+nb<=zt[j].capacity){asgn[zt[j].id]=(asgn[zt[j].id]||0)+nb;asgn['r'+r.id]=zt[j].id;done=true;placed++;}}}
  }
  setR(rs.map(function(r){return asgn['r'+r.id]?Object.assign({},r,{table:asgn['r'+r.id]}):r;}));
  flash(placed+' réservation(s) placée(s)');
}
function saveTbl(id){setT(getT().map(function(t){return t.id===id?Object.assign({},t,{name:etD.name,capacity:parseInt(etD.capacity)||10,zone:etD.zone}):t;}));etId=null;etD=null;flash('Table modifiée');}
function addTbl(){if(!ntbl.name.trim()){alert('Donnez un nom');return;}setT(getT().concat([{id:Date.now(),name:ntbl.name,capacity:parseInt(ntbl.capacity)||10,zone:ntbl.zone}]));ntbl={name:'',capacity:10,zone:'milieu'};flash('Table ajoutée');}
function expCSV(){
  var rs=getR(),t=getT();
  var hdr=['N°','Nom','Adresse','Commune','Association','Adultes','Accompagnants','Baeckeoffe','Escalope','Assiette','Montant dû','Montant payé','Reste','Paiements','Statut','Table','Zone','Préférence','Notes'];
  var rows=rs.map(function(r){var tbl=t.find(function(x){return String(x.id)===String(r.table);});var du=mDu(r),pa=f2(mPa(r));return[r.id,r.nom||'',r.adr||'',r.commune||'',r.assoc||'',parseInt(r.adults)||0,parseInt(r.accomp)||0,parseInt(r.bk)||0,parseInt(r.esc)||0,parseInt(r.ass)||0,du,pa,f2(du-pa),(r.pays||[]).filter(function(p){return parseFloat(p.mt)>0;}).map(function(p){return p.type+' '+p.mt+'€'+(p.ref?' ('+p.ref+')':'');}).join(' | '),stat(r)==='paid'?'Payé':stat(r)==='partial'?'Partiel':'En attente',tbl?tbl.name:'',tbl?tbl.zone:'',r.pref||'',r.notes||''];});
  var csv=hdr.join(';')+'\n'+rows.map(function(r){return r.map(function(v){return'"'+String(v).replace(/"/g,'""')+'"';}).join(';');}).join('\n');
  var blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='Baeckeoffe2025_Salle'+cS+'.csv';a.click();URL.revokeObjectURL(url);flash('Export CSV téléchargé');
}
function doSetup(){var k=document.getElementById('skey').value.trim();if(!k){alert('Entrez la clé');return;}AKEY=k;localStorage.setItem('bk_key',k);document.getElementById('sovl').style.display='none';doLoad(function(d){if(d&&(d.rA||d.rB)){DATA=d;saveLocal(DATA);}R();flash('Données chargées ☁️');});}
function doLocal(){AKEY='LOCAL';localStorage.setItem('bk_key','LOCAL');document.getElementById('sovl').style.display='none';R();}

(function(){
  var k=localStorage.getItem('bk_key');
  if(k){if(k!=='LOCAL'){AKEY=k;doLoad(function(d){if(d&&(d.rA||d.rB)){DATA=d;saveLocal(DATA);}R();});}else{R();}}
  else{R();document.getElementById('sovl').style.display='flex';}
})();
</script>
